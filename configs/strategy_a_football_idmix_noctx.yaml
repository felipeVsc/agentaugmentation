# Strategy A on football-v1-noctx-idmix (scripts/football_identifier_mix_noctx.py): v1_ctx_idmix without context
# properties. Same prompts, models and settings as configs/strategy_a_football_idmix.yaml, and the same response
# cache: the 189 tasks without context properties are the same prompts, so only the 44 changed tasks are called.
#   strategy-a run --config configs/strategy_a_football_idmix_noctx.yaml --models cloud-gemma4-31b

inputs:
  tasks: tasks/football/v1_noctx_idmix/tasks.csv
  examples: data/examples/football_v1.json          # scripts/build_fewshot_examples_v2.py
runs_per_task: 3
pfe_tokenizer: cl100k_base
repair: true
output_dir: results/football/v1_noctx_idmix/strategy_a/
cache_dir: results/football/v1_ctx_idmix/strategy_a/cache/

templates:
  # The 9 prompts of Figure 2 of the draft (templates/figure2, from the published prompts in templates/dolap2026).
  - {id: compact,  file: templates/figure2/compact.v2.txt, output: csv}
  - {id: zero,     file: templates/figure2/zero.v2.txt,    output: csv}
  - {id: few,      file: templates/figure2/few.v2.txt,     output: csv, n_examples: [1, 3, 5]}
  - {id: zerocot,  file: templates/figure2/zerocot.v2.txt, output: csv, expected_output_tokens: 300}
  - {id: fewcot,   file: templates/figure2/fewcot.v2.txt,  output: csv, expected_output_tokens: 300, n_examples: [1, 3, 5]}

model_defaults:
  provider: ollama
  params: {temperature: 0.7, max_tokens: 4096}   # includes gpt-oss's reasoning tokens
  max_concurrency: 3   # Ollama Pro: 3 concurrent requests per account, so run one model (and one strategy) at a time
  timeout_s: 600
  max_retries: 5
  energy: {method: none}
  options: {num_ctx: 8192, keep_alive: 30m, seed: 0}

models:
  # Reasoning off for every model that allows it (2026-10-28). gpt-oss cannot turn it off
  # (`think: false` is ignored), so it runs at the lowest effort, `low`; its reasoning tokens are logged per run.
  # Energy: EcoLogits; models it does not know use a registered model of similar size (total / active parameters).
  - id: cloud-gpt-oss-20b               # 21B total, 3.6B active (MoE)
    model: gpt-oss:20b
    api_key_env: OLLAMA_API_KEY
    options: {base_url: "https://ollama.com", think: low}
    pricing: {input_per_mtok: 0.07, output_per_mtok: 0.3, as_of: "2026-10-27"}   # USD per 1M tokens (Ollama Cloud)
    energy: {method: ecologits, ecologits_provider: huggingface_hub, ecologits_model: openai/gpt-oss-20b}
  - id: cloud-gpt-oss-120b              # 117B total, 5.1B active (MoE)
    model: gpt-oss:120b
    api_key_env: OLLAMA_API_KEY
    options: {base_url: "https://ollama.com", think: low}
    pricing: {input_per_mtok: 0.15, output_per_mtok: 0.6, as_of: "2026-10-28"}   # USD per 1M tokens (Ollama Cloud)
    energy: {method: ecologits, ecologits_provider: huggingface_hub, ecologits_model: openai/gpt-oss-120b}
  - id: cloud-gemma4-31b               # 31B, dense; replaces nemotron-3-super (2026-10-28): without thinking it
    model: gemma4:31b                   # wrote its reasoning in the answer, with thinking it was the only model
    api_key_env: OLLAMA_API_KEY
    options: {base_url: "https://ollama.com", think: false}   # reasoning at length (~1,240 tokens per run)
    pricing: {input_per_mtok: 0.14, output_per_mtok: 0.40, as_of: "2026-10-28"}   # USD per 1M tokens (Ollama Cloud)
    energy: {method: ecologits, ecologits_provider: google_genai, ecologits_model: gemma-4-31b-it}   # the same model
  - id: cloud-mistral-large-3           # 675B total, 41B active (MoE); no reasoning mode
    model: mistral-large-3:675b
    api_key_env: OLLAMA_API_KEY
    options: {base_url: "https://ollama.com"}
    pricing: {input_per_mtok: 0.5, output_per_mtok: 1.5, as_of: "2026-10-28"}   # USD per 1M tokens (Ollama Cloud)
    energy: {method: ecologits, ecologits_provider: mistralai, ecologits_model: mistral-large-2512}   # the same model
  - id: cloud-deepseek-v4.1-flash       # 763B total, ~16B active (MoE); replaces minimax-m3.1-flash (2026-10-28), whose
    model: deepseek-v4.1-flash          # `low` reasoning was ~1,000 tokens per run; glm-5.3-flash reasoned in its answer
    api_key_env: OLLAMA_API_KEY
    options: {base_url: "https://ollama.com", think: false}   # reasoning really off (~12 output tokens per run)
    pricing: {input_per_mtok: 0.30, output_per_mtok: 1.20, as_of: "2026-10-28"}   # peak rate (upper bound); off-peak, outside 12:00-18:00 UTC on weekdays, is half
    energy: {method: ecologits, ecologits_provider: mistralai, ecologits_model: zai-glm-5-3}   # closest total size: 744B / 40B active
